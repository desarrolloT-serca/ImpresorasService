# CI ImpresorasServiceV1 (.NET + módulo React).
# Ampliar con E2E y con pruebas contra PostgreSQL real cuando crezca la batería de pruebas.
name: ImpresorasService CI

on:
  push:
    branches: ["**"]
    paths:
      - "ImpresorasServiceV1/**"
      - ".github/workflows/impresoras-service-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "ImpresorasServiceV1/**"
      - ".github/workflows/impresoras-service-ci.yml"

jobs:
  dotnet:
    name: Build and test (.NET 8)
    # H-11: en ubuntu,
    # RuntimeInformation.IsOSPlatform(OSPlatform.Windows) es false y TODO el CI corria con
    # NoOpPrintSpooler — la rama de produccion de AddInfrastructure no se ejercitaba nunca, y
    # tampoco el fail-fast que exige spooler real fuera de desarrollo. En windows-latest se
    # ejercita la seleccion correcta. NO cierra H-11: sigue sin haber pruebas de
    # WindowsPrintSpooler en si, que necesitan un spooler o una impresora.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ImpresorasServiceV1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ImpresorasServiceV1.sln

      - name: Build
        run: dotnet build ImpresorasServiceV1.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ImpresorasService.Api.IntegrationTests/ImpresorasService.Api.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

  # Origen del módulo de impresión que se copia al ERP (sin frontal propio desde el 11/11/2026).
  web:
    name: Módulo de impresión (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImpresorasServiceV1/src/ImpresorasService.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
