# CI ImpresorasServiceV1 (.NET + Laravel).
# Ampliar con E2E y smoke HANA cuando crezca la batería de pruebas.
name: ImpresorasService CI

on:
  push:
    branches: ["**"]
    paths:
      - "ImpresorasServiceV1/**"
      - ".github/workflows/impresoras-service-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "ImpresorasServiceV1/**"
      - ".github/workflows/impresoras-service-ci.yml"

jobs:
  dotnet:
    name: Build and test (.NET 8)
    # H-11 (docs/auditoria/revision-garantias-2026-08-12.md): en ubuntu,
    # RuntimeInformation.IsOSPlatform(OSPlatform.Windows) es false y TODO el CI corria con
    # NoOpPrintSpooler — la rama de produccion de AddInfrastructure no se ejercitaba nunca, y
    # tampoco el fail-fast que exige spooler real fuera de desarrollo. En windows-latest se
    # ejercita la seleccion correcta. NO cierra H-11: sigue sin haber pruebas de
    # WindowsPrintSpooler en si, que necesitan un spooler o una impresora.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ImpresorasServiceV1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ImpresorasServiceV1.sln

      - name: Build
        run: dotnet build ImpresorasServiceV1.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ImpresorasService.Api.IntegrationTests/ImpresorasService.Api.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

  php:
    name: Test (Laravel / PHP 8.2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImpresorasServiceV1/src/ImpresorasService.Web.PHP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, curl, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      # A-UI-05 (docs/auditoria-integral-2026-07-21.md): antes del fix, el CI nunca ejecutaba
      # `vite build` — un error en dbx.css/system.css/app.js solo se descubría en producción,
      # degradando silenciosamente al fallback inline documentado en layouts/app.blade.php.
      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Test
        run: php artisan test
