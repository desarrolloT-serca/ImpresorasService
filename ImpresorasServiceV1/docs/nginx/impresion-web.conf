# Frontend React (src/ImpresorasService.Web). Convive con el PHP hasta retirarlo (docs/PLAN.md, B7):
# otro nombre de servidor y el mismo Kestrel. Sustituir dominio, rutas y certificados.
# Guía: docs/DESPLIEGUE-WEB.md
server {
    listen 80;
    server_name impresion.empresa.com;
    return 301 https://impresion.empresa.com$request_uri;
}

server {
    listen 443 ssl;
    server_name impresion.empresa.com;
    ssl_certificate /etc/ssl/impresion-web/fullchain.pem;
    ssl_certificate_key /etc/ssl/impresion-web/private.key;

    # Contenido de dist/ (npm ci && npm run build).
    root /var/www/impresion-web;
    client_max_body_size 64k;

    # La cookie de sesión es Secure: sin HTTPS no hay sesión.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # El día del iframe en el ERP: Content-Security-Policy "frame-ancestors <origen del ERP>".
    add_header X-Frame-Options DENY always;

    # El módulo pide /api/impresion/…, como lo pedirá a la pasarela del ERP. La URI de proxy_pass
    # sustituye el prefijo: /api/impresion/printjobs llega a Kestrel como /api/printjobs.
    # Solo se publica esto, no /api/ entero.
    location /api/impresion/ {
        proxy_pass http://127.0.0.1:5105/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }

    # Pruebas: el PDF (hasta 20 MB) va en base64 dentro del JSON, unos 27 MB. Kestrel admite 30 MB.
    location /api/impresion/sourceprintjobs/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:5105/api/sourceprintjobs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }

    # Un add_header dentro de location anula los del server: se repiten.
    location /assets/ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-cache";
    }
}
