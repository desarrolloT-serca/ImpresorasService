schema: spec-driven
context: |
  Proyecto: ImpresorasServiceV1
  - Backend (core + dominio): .NET 8 (ImpresorasService.Core) con estado de PrintJob y eventos.
  - API + autenticación JWT: ImpresorasService.Api (ASP.NET Core).
  - Worker: ImpresorasService.Worker (ingesta + ejecución de impresión por reintentos).
  - UI oficial: ImpresorasService.Web.PHP (Laravel 12) que consume la API (Bearer token en sesión).

  Flujo de negocio (alto nivel):
  - Ingesta: SourcePrintJobs (staging/idempotencia) -> PrintJobs (Pending) + auto-routing a Routed.
  - Ejecución: Routed -> Printing -> (SpoolAccepted | RetryScheduled | ErrorFinal).
  - Recuperación: jobs "stale" en Printing deben poder recuperarse sin quedar pegados.
  - Operación manual: Route (Pending/ErrorFinal->Pending y reintentar) y Cancel (Pending/Routed/RetryScheduled/ErrorFinal->Cancelled).

  Estándares de tests (industria):
  - Tests con SQLite en memoria (con conexión abierta durante el test).
  - Arrange/Act/Assert claro.
  - No flakey: aserciones de tiempo con rangos, no equality exacta.
  - Fakes para spooler (éxito/transitorio/permanente/excepción).
  - Probar persistencia en DB y verificación de eventos (PrintJobEvents) cuando aplique.

rules:
  proposal:
    - En TODA propuesta, incluir secciones: "Resumen", "Alcance", "No-objetivos", "Criterios de aceptación", "Riesgos/impacto", "Plan de pruebas".
    - Los "Criterios de aceptación" deben ser medibles y verificar comportamiento: estados (`PrintJobStatus`), códigos de error, HTTP status, eventos persistidos y/o cambios en BD.
    - El "Plan de pruebas" debe incluir explícitamente casos de "acierto" y casos de "error" (edge cases) y cómo se validan (aserciones).
    - Si el cambio toca la máquina de estados de `PrintJob` (retry/cancel/printing), construir un mini "matriz de transiciones" (from -> to) que cubra éxito y fallo.
  tasks:
    - Cuando una tarea toca "estado + reintentos" (PrintJobStatus), incluir tests de transiciones y de eventos persistidos.
    - Evitar cambios de schema/DB manuales sin tests de regresión.
    - Si un cambio toca enrutado, incluir casos con prioridad/especificidad y "route not found".
  design:
    - Documentar explícitamente cualquier decisión sobre recuperación de estados (p.ej. stale Printing).


